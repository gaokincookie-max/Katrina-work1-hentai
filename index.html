<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家庭科 確認テスト</title>
<style>
:root {
  --bg:#f5f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#dbe2ea;
  --accent:#315f9b; --ok:#18794e; --ng:#b42318; --soft:#eef4fb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.65}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 56px}
header{margin-bottom:18px}
h1{font-size:clamp(26px,4vw,40px);margin:0 0 8px}
.sub{color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(31,41,55,.05);margin-top:16px}
.controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
label{font-size:13px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px}
select,button,input[type=text]{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
button{cursor:pointer;font-weight:800}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.secondary{background:#fff;color:var(--accent)}
.small{width:auto;padding:8px 12px}
.stats{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:12px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.badge{display:inline-block;background:var(--soft);color:var(--accent);padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800}
.qtext{font-size:21px;font-weight:800;margin:14px 0}
.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#fff}
.choice:hover{background:#f8fafc}
.choice.selected{border-color:var(--accent);background:var(--soft)}
.answerRow{display:flex;gap:10px;align-items:center}
.answerRow input{flex:1}
.result{margin-top:14px;padding:14px;border-radius:12px;font-weight:700}
.result.ok{background:#eaf7f0;color:var(--ok)}
.result.ng{background:#fff0ee;color:var(--ng)}
.expl{margin-top:10px;padding:14px;background:#f8fafc;border-radius:12px}
.page{color:var(--muted);font-size:13px;margin-top:7px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.progress{height:10px;background:#e8edf3;border-radius:999px;overflow:hidden;margin-top:12px}
.progress>div{height:100%;background:var(--accent);width:0}
.summaryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.metric{background:#f8fafc;border-radius:12px;padding:12px;text-align:center}
.metric b{display:block;font-size:24px}
.mistake{border-top:1px solid var(--line);padding:12px 0}
.note{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
footer{margin-top:28px;color:var(--muted);font-size:13px}
@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.summaryGrid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.controls{grid-template-columns:1fr}.qtext{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>家庭科 確認テスト</h1>
  <p class="sub">通常モード 251問 ＋ 変態モード 61問。変態モードは細かい区別・逆引き・ひっかけ・複合問題中心です。</p>
</header>

<section class="card" id="setup">
  <div class="controls">
    <div><label>モード</label>
      <select id="mode">
        <option value="normal">通常モード</option>
        <option value="hard">変態モード 🔥</option>
        <option value="mix">混合モード</option>
      </select>
    </div>
    <div><label>単元</label><select id="unit"></select></div>
    <div><label>出題形式</label>
      <select id="format">
        <option value="all">すべて</option>
        <option>選択</option><option>穴埋め</option><option>○×</option><option>計算</option>
      </select>
    </div>
    <div><label>問題数</label>
      <select id="count"><option>10</option><option>20</option><option>30</option><option>50</option><option>100</option><option>150</option><option>200</option><option value="all">全問</option></select>
    </div>
    <div><label>並び順</label>
      <select id="order"><option value="random">ランダム</option><option value="fixed">範囲順</option></select>
    </div>
  </div>
  <div class="stats" id="available"></div>
  <button class="primary" id="start" style="margin-top:14px">テスト開始</button>
</section>

<section class="card hidden" id="quiz">
  <div class="qhead">
    <div><span class="badge" id="badge"></span></div>
    <div class="note" id="counter"></div>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div class="qtext" id="qtext"></div>
  <div id="answerArea"></div>
  <div id="feedback"></div>
  <div class="nav">
    <button class="secondary small" id="quit">設定に戻る</button>
    <div style="display:flex;gap:8px">
      <button class="secondary small hidden" id="showAnswer">答えを見る</button>
      <button class="primary small" id="check">提出</button>
      <button class="primary small hidden" id="next">次へ</button>
    </div>
  </div>
</section>

<section class="card hidden" id="summary">
  <h2 style="margin-top:0">結果</h2>
  <div class="summaryGrid">
    <div class="metric"><span>問題数</span><b id="mTotal">0</b></div>
    <div class="metric"><span>正解</span><b id="mCorrect">0</b></div>
    <div class="metric"><span>正答率</span><b id="mRate">0%</b></div>
    <div class="metric"><span>要復習</span><b id="mMistakes">0</b></div>
  </div>
  <div id="mistakes"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
    <button class="primary small" id="retryMistakes">間違えた問題だけ再挑戦</button>
    <button class="secondary small" id="backSetup">条件を変えてもう一度</button>
  </div>
</section>

<footer>
  <p>ページ表記は写真から確認できた箇所だけ付けています。ノートの手書き内容は正解根拠にせず、教科書本文を優先しています。変態モードも同じ範囲内の細部・区別を厳しく問う構成です。</p>
</footer>
</div>

document.getElementById('start').onclick=()=>{

      const b=document.createElement('button'); b.className='choice'; b.textContent=c;
      b.onclick=()=>{selected=c;[...a.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');checkAnswer()};
      a.appendChild(b);
    });
  } else if(q.format==='○×'){
    ['○','×'].forEach(c=>{
      const b=document.createElement('button'); b.className='choice'; b.textContent=c;
      b.onclick=()=>{selected=c;[...a.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');checkAnswer()};
      a.appendChild(b);
    });
  } else {
    const row=document.createElement('div'); row.className='answerRow';
    const input=document.createElement('input'); input.type='text'; input.id='textAnswer'; input.placeholder='答えを入力';
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!checked)checkAnswer()});
    row.appendChild(input); a.appendChild(row); setTimeout(()=>input.focus(),50);
  }
}

function judge(q,user){
  if(q.format==='選択'||q.format==='○×') return user===q.answer;
  const acceptable=(q.accept&&q.accept.length?q.accept:[q.answer]).map(normalize);
  return acceptable.includes(normalize(user));
}
function checkAnswer(){
  if(checked)return;
  const q=session[idx];
  const user=(q.format==='選択'||q.format==='○×')?selected:document.getElementById('textAnswer').value;
  const isBlank = (user===null || String(user).trim()==='');
  const submitted = isBlank ? '未回答' : user;
  const ok = isBlank ? false : judge(q,user);
  checked=true;
  answers.push({q,user:submitted,ok});
  const fb=document.getElementById('feedback');
  fb.innerHTML=`<div class="result ${ok?'ok':'ng'}">${ok?'正解！':'不正解'}　正答：${q.answer}</div>
  <div class="expl">${q.explanation}${q.page?`<div class="page">掲載：${q.page}</div>`:''}</div>`;
  document.getElementById('check').classList.add('hidden');
  document.getElementById('showAnswer').classList.add('hidden');
  document.getElementById('next').classList.remove('hidden');
  document.getElementById('bar').style.width=((idx+1)/session.length*100)+'%';
}
document.getElementById('check').onclick=checkAnswer;
document.getElementById('showAnswer').onclick=()=>{
  const q=session[idx];
  document.getElementById('feedback').innerHTML=`<div class="expl"><b>正答：</b>${q.answer}<br>${q.explanation}${q.page?`<div class="page">掲載：${q.page}</div>`:''}</div>`;
};
document.getElementById('next').onclick=()=>{ if(idx<session.length-1){idx++;render()}else finish(); };
document.getElementById('quit').onclick=()=>{if(confirm('現在のテストを終了して設定に戻りますか？')){quiz.classList.add('hidden');setup.classList.remove('hidden')}};

function finish(){
  quiz.classList.add('hidden');summary.classList.remove('hidden');
  const correct=answers.filter(x=>x.ok).length, total=answers.length, mistakes=answers.filter(x=>!x.ok);
  document.getElementById('mTotal').textContent=total;
  document.getElementById('mCorrect').textContent=correct;
  document.getElementById('mRate').textContent=Math.round(correct/total*100)+'%';
  document.getElementById('mMistakes').textContent=mistakes.length;
  const box=document.getElementById('mistakes');
  if(!mistakes.length) box.innerHTML='<p class="result ok">全問正解です。</p>';
  else box.innerHTML='<h3>要復習</h3>'+mistakes.map((x,i)=>`<div class="mistake"><b>${i+1}. ${x.q.q}</b><br>あなた：${x.user}<br>正答：${x.q.answer}<div class="note">${x.q.explanation}${x.q.page?' ／ '+x.q.page:''}</div></div>`).join('');
  document.getElementById('retryMistakes').classList.toggle('hidden',!mistakes.length);
}
document.getElementById('retryMistakes').onclick=()=>begin(answers.filter(x=>!x.ok).map(x=>x.q));
document.getElementById('backSetup').onclick=()=>{summary.classList.add('hidden');setup.classList.remove('hidden');};
</script>
</body>
